<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipment ID Test — Gemini</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#f4f1ea;padding:20px;color:#1c1208}
  .wrap{max-width:480px;margin:0 auto}
  h1{font-size:1.2rem;margin-bottom:4px}
  .sub{font-size:.8rem;color:#666;margin-bottom:16px}
  select{width:100%;padding:12px;margin-bottom:16px;border-radius:8px;border:1px solid #ccc;font-size:1rem}
  input[type=file]{display:none}
  .upload-btn{display:block;width:100%;padding:16px;background:#1c1208;color:#fff;
    text-align:center;border-radius:8px;font-size:1rem;cursor:pointer;margin-bottom:16px}
  .preview{width:100%;border-radius:8px;margin-bottom:16px;display:none}
  .status{font-size:.85rem;color:#666;margin-bottom:16px;display:none}
  .result{background:#fff;border-radius:8px;padding:14px;margin-bottom:10px;
    border:1px solid rgba(0,0,0,.08);display:none;white-space:pre-wrap;font-size:.85rem;line-height:1.5}
  .error{color:#b00020;font-size:.85rem;padding:10px;background:#fce8e8;border-radius:6px;display:none}
  .count{font-size:.75rem;color:#888;margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Equipment ID Test — Gemini</h1>
  <div class="sub">Pick a category to narrow the comparison set, then take a photo of an installed device.</div>

  <select id="categorySelect">
    <option value="">Loading categories...</option>
  </select>
  <div class="count" id="countDisplay"></div>

  <label class="upload-btn" for="photoInput">Take / Upload Photo</label>
  <input type="file" id="photoInput" accept="image/*">

  <button class="upload-btn" id="tinyTestBtn" style="background:#555">Run Tiny Test (no photo)</button>
  <button class="upload-btn" id="groundedTestBtn" style="background:#2a6f4f" disabled>Test with Grounded Search (upload a photo first)</button>

  <img class="preview" id="preview">
  <div class="status" id="status">Analyzing...</div>
  <div class="error" id="error"></div>
  <div class="result" id="result"></div>
</div>

<script>
const PROXY = 'https://www.safestepsplansforms.com/_functions/geminiDetect';
const GROUNDED_WORKER_URL = 'https://restless-king-cbcd.jack-limongelli.workers.dev';
const REFERENCE_JSON_URL = 'https://raw.githubusercontent.com/jacklimongelli/safesteps-wizard/main/reference-images.json';

let lastBase64Image = null; // cached after upload so the grounded-search button can reuse it

const categorySelect = document.getElementById('categorySelect');
const countDisplay = document.getElementById('countDisplay');
const photoInput = document.getElementById('photoInput');
const preview = document.getElementById('preview');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const resultEl = document.getElementById('result');

let allReferenceImages = [];
let categoryGroups = {};

// Load the full reference set once, group by Equipment Type, populate dropdown
async function loadReferenceImages() {
  try {
    const res = await fetch(REFERENCE_JSON_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    allReferenceImages = await res.json();

    categoryGroups = {};
    for (const img of allReferenceImages) {
      const key = img.equipmentType || 'Unknown';
      if (!categoryGroups[key]) categoryGroups[key] = [];
      categoryGroups[key].push(img);
    }

    const sortedKeys = Object.keys(categoryGroups).sort(
      (a, b) => categoryGroups[b].length - categoryGroups[a].length
    );

    categorySelect.innerHTML = sortedKeys
      .map(key => `<option value="${key}">${key} (${categoryGroups[key].length} images)</option>`)
      .join('');

    updateCountDisplay();
  } catch (err) {
    categorySelect.innerHTML = '<option value="">Failed to load reference set</option>';
    errorEl.textContent = 'Could not load reference-images.json — Error: ' + err.message;
    errorEl.style.display = 'block';
  }
}

function updateCountDisplay() {
  const selected = categorySelect.value;
  const count = categoryGroups[selected] ? categoryGroups[selected].length : 0;
  countDisplay.textContent = count
    ? `Will compare against ${count} reference image(s) in "${selected}".`
    : '';
}

categorySelect.addEventListener('change', updateCountDisplay);

loadReferenceImages();

document.getElementById('tinyTestBtn').addEventListener('click', async () => {
  errorEl.style.display = 'none';
  resultEl.style.display = 'none';
  statusEl.style.display = 'block';
  statusEl.textContent = 'Running tiny test...';

  try {
    const canvas = document.createElement('canvas');
    canvas.width = 50; canvas.height = 50;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'white'; ctx.fillRect(0,0,50,50);
    ctx.fillStyle = 'black'; ctx.fillRect(10,10,30,30);
    const base64 = canvas.toDataURL('image/png').split(',')[1];

    statusEl.textContent = 'Tiny payload: ' + base64.length + ' bytes. Sending...';

    const res = await fetch(PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: base64, mimeType: 'image/png' })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderResult(data);

  } catch (err) {
    errorEl.textContent = 'Tiny test failed — Error name: ' + err.name + ' | Message: ' + err.message;
    errorEl.style.display = 'block';
  } finally {
    statusEl.style.display = 'none';
  }
});

photoInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const selectedCategory = categorySelect.value;
  const referenceImages = categoryGroups[selectedCategory] || [];

  if (!referenceImages.length) {
    errorEl.textContent = 'Pick a category first, no reference images selected.';
    errorEl.style.display = 'block';
    return;
  }

  errorEl.style.display = 'none';
  resultEl.style.display = 'none';

  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  statusEl.style.display = 'block';

  try {
    const base64 = await resizeAndEncode(file, 1200);
    lastBase64Image = base64;
    document.getElementById('groundedTestBtn').disabled = false;
    document.getElementById('groundedTestBtn').textContent = 'Test with Grounded Search (Cloudflare)';

    statusEl.textContent = 'Payload size: ' + Math.round(base64.length / 1024) + ' KB. Comparing against ' + referenceImages.length + ' reference images. Sending...';

    const res = await fetch(PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image: base64,
        mimeType: 'image/jpeg',
        referenceImages: referenceImages.map(r => ({
          brand: r.brand,
          model: r.model,
          imageUrl: r.imageUrl
        }))
      })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderResult(data);

  } catch (err) {
    errorEl.textContent = 'Error name: ' + err.name + ' | Message: ' + err.message + ' | Type: ' + typeof err;
    errorEl.style.display = 'block';
  } finally {
    statusEl.style.display = 'none';
  }
});

document.getElementById('groundedTestBtn').addEventListener('click', async () => {
  if (!lastBase64Image) {
    errorEl.textContent = 'Upload a photo first.';
    errorEl.style.display = 'block';
    return;
  }

  errorEl.style.display = 'none';
  resultEl.style.display = 'none';
  statusEl.style.display = 'block';
  statusEl.textContent = 'Running grounded search via Cloudflare Worker...';

  try {
    const res = await fetch(GROUNDED_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image: lastBase64Image,
        mimeType: 'image/jpeg'
      })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderResult(data);

  } catch (err) {
    errorEl.textContent = 'Grounded search failed — Error name: ' + err.name + ' | Message: ' + err.message;
    errorEl.style.display = 'block';
  } finally {
    statusEl.style.display = 'none';
  }
});

function resizeAndEncode(file, maxWidth) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();

    reader.onload = () => { img.src = reader.result; };
    reader.onerror = reject;

    img.onload = () => {
      let { width, height } = img;
      if (width > maxWidth) {
        height = Math.round(height * (maxWidth / width));
        width = maxWidth;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);

      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      resolve(dataUrl.split(',')[1]);
    };
    img.onerror = reject;

    reader.readAsDataURL(file);
  });
}

function renderResult(data) {
  const candidate = data.candidates && data.candidates[0];
  const text = candidate && candidate.content && candidate.content.parts
    ? candidate.content.parts.map(p => p.text).filter(Boolean).join('\n')
    : null;

  if (!text) {
    errorEl.textContent = 'No response text returned. Raw response: ' + JSON.stringify(data).slice(0, 500);
    errorEl.style.display = 'block';
    return;
  }

  resultEl.textContent = text;
  resultEl.style.display = 'block';
}
</script>
</body>
</html>
