  .sub{font-size:.8rem;color:#666;margin-bottom:20px}
  input[type=file]{display:none}
  .upload-btn{display:block;width:100%;padding:16px;background:#1c1208;color:#fff;
    text-align:center;border-radius:8px;font-size:1rem;cursor:pointer;margin-bottom:16px}
  .preview{width:100%;border-radius:8px;margin-bottom:16px;display:none}
  .status{font-size:.85rem;color:#666;margin-bottom:16px;display:none}

    border:1px solid rgba(0,0,0,.08);display:none;white-space:pre-wrap;font-size:.85rem;line-height:1.5}
  .error{color:#b00020;font-size:.85rem;padding:10px;background:#fce8e8;border-radius:6px;display:none}
</style>

<body>

  <div class="sub">Take a photo of an installed device to test Gemini identification.</div>

  <label class="upload-btn" for="photoInput">Take / Upload Photo</label>
  <input type="file" id="photoInput" accept="image/*">

  <img class="preview" id="preview">
  <div class="status" id="status">Analyzing...</div>
  <div class="error" id="error"></div>
  <div class="result" id="result"></div>

document.getElementById('tinyTestBtn').addEventListener('click', async () => {
  errorEl.style.display = 'none';
  resultEl.style.display = 'none';
  statusEl.style.display = 'block';
  statusEl.textContent = 'Running tiny test...';

  try {
    const canvas = document.createElement('canvas');
    canvas.width = 50; canvas.height = 50;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'white'; ctx.fillRect(0,0,50,50);
    ctx.fillStyle = 'black'; ctx.fillRect(10,10,30,30);
    const base64 = canvas.toDataURL('image/png').split(',')[1];

    statusEl.textContent = 'Tiny payload: ' + base64.length + ' bytes. Sending...';

    const res = await fetch(PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: base64, mimeType: 'image/png' })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderResult(data);

  } catch (err) {
    errorEl.textContent = 'Tiny test failed — Error name: ' + err.name + ' | Message: ' + err.message;
    errorEl.style.display = 'block';
  } finally {
    statusEl.style.display = 'none';
  }
});

photoInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  errorEl.style.display = 'none';
  resultEl.style.display = 'none';

  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  statusEl.style.display = 'block';

  try {
    const base64 = await resizeAndEncode(file, 1200);
    statusEl.textContent = 'Payload size: ' + Math.round(base64.length / 1024) + ' KB. Sending...';
    const res = await fetch(PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image: base64,
        mimeType: 'image/jpeg',
        referenceImages: referenceImages
      })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderResult(data);

  } catch (err) {
    errorEl.textContent = 'Error name: ' + err.name + ' | Message: ' + err.message + ' | Type: ' + typeof err;
    errorEl.style.display = 'block';
  } finally {
    statusEl.style.display = 'none';
  }
});

function resizeAndEncode(file, maxWidth) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();

    reader.onload = () => { img.src = reader.result; };
    reader.onerror = reject;

    img.onload = () => {
      let { width, height } = img;
      if (width > maxWidth) {
        height = Math.round(height * (maxWidth / width));
        width = maxWidth;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);

      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      resolve(dataUrl.split(',')[1]);
    };
    img.onerror = reject;

    reader.readAsDataURL(file);
  });
}

function renderResult(data) {
  const candidate = data.candidates && data.candidates[0];
  const text = candidate && candidate.content && candidate.content.parts
    ? candidate.content.parts.map(p => p.text).filter(Boolean).join('\n')
    : null;

  if (!text) {
    errorEl.textContent = 'No response text returned. Raw response: ' + JSON.stringify(data).slice(0, 500);
    errorEl.style.display = 'block';
    return;
  }

  resultEl.textContent = text;
  resultEl.style.display = 'block';
}
