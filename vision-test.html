<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipment ID Test — Gemini</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#f4f1ea;padding:20px;color:#1c1208}
  .wrap{max-width:480px;margin:0 auto}
  h1{font-size:1.2rem;margin-bottom:4px}
  .sub{font-size:.8rem;color:#666;margin-bottom:20px}
  input[type=file]{display:none}
  .upload-btn{display:block;width:100%;padding:16px;background:#1c1208;color:#fff;
    text-align:center;border-radius:8px;font-size:1rem;cursor:pointer;margin-bottom:16px}
  .preview{width:100%;border-radius:8px;margin-bottom:16px;display:none}
  .status{font-size:.85rem;color:#666;margin-bottom:16px;display:none}
  .result{background:#fff;border-radius:8px;padding:14px;margin-bottom:10px;
    border:1px solid rgba(0,0,0,.08);display:none;white-space:pre-wrap;font-size:.85rem;line-height:1.5}
  .error{color:#b00020;font-size:.85rem;padding:10px;background:#fce8e8;border-radius:6px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Equipment ID Test — Gemini</h1>
  <div class="sub">Take a photo of an installed device to test Gemini identification.</div>

  <label class="upload-btn" for="photoInput">Take / Upload Photo</label>
  <input type="file" id="photoInput" accept="image/*">

  <img class="preview" id="preview">
  <div class="status" id="status">Analyzing...</div>
  <div class="error" id="error"></div>
  <div class="result" id="result"></div>
</div>

<script>
// Update this to match your actual Wix site domain
const PROXY = 'https://www.safestepsplansforms.com/_functions/geminiDetect';

const photoInput = document.getElementById('photoInput');
const preview = document.getElementById('preview');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const resultEl = document.getElementById('result');

photoInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  errorEl.style.display = 'none';
  resultEl.style.display = 'none';

  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  statusEl.style.display = 'block';

  try {
    const base64 = await resizeAndEncode(file, 1200);
    const res = await fetch(PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image: base64,
        mimeType: 'image/jpeg'
        // referenceImages: [] — add labeled candidate images here later
        // to test real comparisons, e.g.:
        // referenceImages: [{ image: '<base64>', mimeType: 'image/jpeg', label: '9120B' }, ...]
      })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderResult(data);

  } catch (err) {
    errorEl.textContent = 'Error: ' + err.message;
    errorEl.style.display = 'block';
  } finally {
    statusEl.style.display = 'none';
  }
});

function resizeAndEncode(file, maxWidth) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();

    reader.onload = () => { img.src = reader.result; };
    reader.onerror = reject;

    img.onload = () => {
      let { width, height } = img;
      if (width > maxWidth) {
        height = Math.round(height * (maxWidth / width));
        width = maxWidth;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);

      // 0.85 quality JPEG — small file, no visible detail loss for this use case
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      resolve(dataUrl.split(',')[1]);
    };
    img.onerror = reject;

    reader.readAsDataURL(file);
  });
}

function renderResult(data) {
  const candidate = data.candidates && data.candidates[0];
  const text = candidate && candidate.content && candidate.content.parts
    ? candidate.content.parts.map(p => p.text).filter(Boolean).join('\n')
    : null;

  if (!text) {
    errorEl.textContent = 'No response text returned. Raw response: ' + JSON.stringify(data).slice(0, 500);
    errorEl.style.display = 'block';
    return;
  }

  resultEl.textContent = text;
  resultEl.style.display = 'block';
}
</script>
</body>
</html>
