<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Equipment ID — Safe Steps</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden;max-width:100vw}
img{max-width:100%;height:auto}

:root{
  --tan:#C3A97D;
  --dark:#1C1208;
  --red:#6e1008;
}

body{
  font-family:Arial,sans-serif;
  background:transparent;
  color:var(--dark);
  overflow-x:hidden;
  max-width:100vw;
}

.wrap{max-width:480px;margin:0 auto;padding:0 20px}

/* ── HERO STRIP ── */
.hero{padding:20px 0 16px;border-bottom:2px solid rgba(28,18,8,.16);position:relative}
.sit-tag{font-size:.78rem;letter-spacing:.08em;color:rgba(28,18,8,.72);display:flex;align-items:center;gap:7px;margin-bottom:10px}
.sit-tag::before{content:'';display:block;width:14px;height:1px;background:rgba(28,18,8,.55);flex-shrink:0}
.hero h1{font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.05;letter-spacing:.02em;color:var(--dark);margin-bottom:10px}
.bodytxt{font-size:.85rem;line-height:1.6;color:rgba(28,18,8,.8);border-left:3px solid rgba(28,18,8,.36);padding-left:12px;max-width:520px}

/* ── SECTIONS ── */
.sec{padding:22px 0;border-bottom:2px solid rgba(28,18,8,.13)}

input[type=file]{display:none}
.btnp{
  display:flex;align-items:center;justify-content:center;width:100%;
  font-family:Arial,sans-serif;font-size:.95rem;letter-spacing:.04em;
  background:var(--dark);color:var(--tan);height:52px;box-sizing:border-box;
  border:2px solid transparent;cursor:pointer;text-decoration:none;margin-bottom:10px;
}
.btns{
  display:flex;align-items:center;justify-content:center;width:100%;
  font-family:Arial,sans-serif;font-size:.95rem;letter-spacing:.04em;
  background:transparent;color:var(--dark);height:52px;box-sizing:border-box;
  border:2px solid rgba(28,18,8,.33);cursor:pointer;text-decoration:none;margin-bottom:10px;
}

.preview{width:100%;border:2px solid rgba(28,18,8,.28);margin-bottom:16px;display:none}
.status{font-size:.82rem;color:rgba(28,18,8,.65);margin-bottom:16px;display:none}
.error{color:#fff;font-size:.82rem;padding:10px 12px;background:var(--red);margin-bottom:16px;display:none;border-left:3px solid var(--dark)}

.matches{display:none}
.matches-label{font-size:.78rem;letter-spacing:.08em;color:var(--dark);display:flex;align-items:center;gap:7px;margin-bottom:14px;text-transform:uppercase;font-weight:bold}
.matches-label::before{content:'';display:block;width:12px;height:1px;background:rgba(28,18,8,.55)}

.room-field{margin-bottom:16px}
.room-field label{display:block;font-size:.72rem;letter-spacing:.05em;color:rgba(28,18,8,.7);margin-bottom:6px;text-transform:uppercase}
.room-field input{
  width:100%;background:rgba(28,18,8,.07);border:1px solid rgba(28,18,8,.3);
  padding:12px 10px;font-family:Arial,sans-serif;font-size:.85rem;color:var(--dark);outline:none;
}
.room-field input::placeholder{color:rgba(28,18,8,.4)}

.match-card{background:#fff;border:1px solid rgba(28,18,8,.28);padding:14px;margin-bottom:12px}
.match-card.selected{border-color:var(--dark);border-width:2px;background:#fdfaf4}
.match-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.match-card img{width:64px;height:64px;object-fit:contain;background:var(--tan);border:1px solid rgba(28,18,8,.2);flex-shrink:0}
.match-info{flex:1}
.match-info .model{font-weight:bold;font-size:.95rem;color:var(--dark)}
.match-info .brand{font-size:.78rem;color:rgba(28,18,8,.65)}
.match-info .score{font-size:.7rem;color:rgba(28,18,8,.5);margin-top:2px}

.specs{font-size:.75rem;color:rgba(28,18,8,.75);line-height:1.7;margin-bottom:12px;
  background:#f7f4ee;border:1px solid rgba(28,18,8,.14);padding:10px}
.specs .spec-row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(28,18,8,.08);padding:3px 0}
.specs .spec-row:last-child{border-bottom:none}
.specs .spec-label{color:rgba(28,18,8,.5);flex-shrink:0}
.specs a{color:var(--dark);font-weight:bold}
.specs .unavailable{color:rgba(28,18,8,.4);font-style:italic}

.add-btn{
  width:100%;padding:11px;background:var(--dark);color:var(--tan);border:none;
  font-family:Arial,sans-serif;font-size:.82rem;letter-spacing:.04em;cursor:pointer;
}
.add-btn:disabled{background:rgba(28,18,8,.25);color:rgba(28,18,8,.5);cursor:not-allowed}
.add-btn.added{background:var(--dark);color:var(--tan)}

.sec-tag{font-size:.78rem;letter-spacing:.08em;color:var(--dark);display:flex;align-items:center;gap:7px;margin-bottom:12px;text-transform:uppercase;font-weight:bold}
.sec-tag::before{content:'';display:block;width:12px;height:1px;background:rgba(28,18,8,.55)}

.list-item{background:#fff;border:1px solid rgba(28,18,8,.28);padding:12px 14px;
  margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.list-item-info{font-size:.83rem;line-height:1.5}
.list-item-info .model{font-weight:bold;color:var(--dark)}
.list-item-info .room{color:rgba(28,18,8,.65)}
.delete-btn{
  background:transparent;color:var(--red);border:1px solid var(--red);
  padding:8px 12px;font-family:Arial,sans-serif;font-size:.72rem;letter-spacing:.03em;
  cursor:pointer;flex-shrink:0;text-transform:uppercase;
}
.empty-list{font-size:.82rem;color:rgba(28,18,8,.5);font-style:italic}
</style>
</head>
<body>

<div class="wrap">

  <div class="sec">
    <label class="btnp" for="cameraInput">TAKE PHOTO</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">

    <label class="btns" for="uploadInput">UPLOAD PHOTO</label>
    <input type="file" id="uploadInput" accept="image/*">

    <img class="preview" id="preview">
    <div class="status" id="status">Analyzing...</div>
    <div class="error" id="error"></div>

    <div class="matches" id="matches">
      <div class="matches-label">Which one is correct?</div>

      <div class="room-field">
        <label for="roomInput">Room this device is in</label>
        <input type="text" id="roomInput" placeholder="e.g. Kitchen, Hallway, Master Bedroom">
      </div>

      <div id="matchList"></div>
    </div>
  </div>

  <div class="sec" style="border-bottom:none">
    <div class="sec-tag">Recorded Equipment</div>
    <div id="runningList"></div>
  </div>

</div>

<script>
const WORKER_URL = 'https://restless-king-cbcd.jack-limongelli.workers.dev';
const PRODUCT_SPECS_URL = 'https://raw.githubusercontent.com/jacklimongelli/safesteps-wizard/main/product-specs.json';

const cameraInput = document.getElementById('cameraInput');
const uploadInput = document.getElementById('uploadInput');
const preview = document.getElementById('preview');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const matchesEl = document.getElementById('matches');
const roomInput = document.getElementById('roomInput');
const matchListEl = document.getElementById('matchList');
const runningListEl = document.getElementById('runningList');

let productSpecs = {};
let recordedEquipment = [];
let addedForCurrentSearch = false;

async function loadProductSpecs() {
  try {
    const res = await fetch(PRODUCT_SPECS_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    productSpecs = await res.json();
  } catch (err) {
    console.error('Failed to load product-specs.json:', err.message);
    productSpecs = {};
  }
}
loadProductSpecs();

async function handlePhoto(file) {
  if (!file) return;

  errorEl.style.display = 'none';
  matchesEl.style.display = 'none';
  addedForCurrentSearch = false;
  roomInput.value = '';

  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  statusEl.style.display = 'block';

  try {
    const base64 = await resizeAndEncode(file, 1200);
    statusEl.textContent = 'Payload size: ' + Math.round(base64.length / 1024) + ' KB. Identifying...';

    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image: base64,
        mimeType: 'image/jpeg'
      })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderResult(data);

  } catch (err) {
    errorEl.textContent = 'Error name: ' + err.name + ' | Message: ' + err.message + ' | Type: ' + typeof err;
    errorEl.style.display = 'block';
  } finally {
    statusEl.style.display = 'none';
  }
}

cameraInput.addEventListener('change', (e) => handlePhoto(e.target.files[0]));
uploadInput.addEventListener('change', (e) => handlePhoto(e.target.files[0]));

function resizeAndEncode(file, maxWidth) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();

    reader.onload = () => { img.src = reader.result; };
    reader.onerror = reject;

    img.onload = () => {
      let { width, height } = img;
      if (width > maxWidth) {
        height = Math.round(height * (maxWidth / width));
        width = maxWidth;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);

      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      resolve(dataUrl.split(',')[1]);
    };
    img.onerror = reject;

    reader.readAsDataURL(file);
  });
}

function specRow(label, value) {
  if (!value) {
    return `<div class="spec-row"><span class="spec-label">${label}</span><span class="unavailable">Not available</span></div>`;
  }
  return `<div class="spec-row"><span class="spec-label">${label}</span><span>${value}</span></div>`;
}

function renderResult(data) {
  if (data.error) {
    errorEl.textContent = 'Worker error: ' + data.error;
    errorEl.style.display = 'block';
    return;
  }

  const matches = (data.matches || []).slice(0, 3);
  if (!matches.length) {
    errorEl.textContent = 'No matches returned. Raw response: ' + JSON.stringify(data).slice(0, 500);
    errorEl.style.display = 'block';
    return;
  }

  matchListEl.innerHTML = '';

  matches.forEach((m) => {
    const specs = productSpecs[m.model.toUpperCase()] || null;

    const card = document.createElement('div');
    card.className = 'match-card';

    const specsHtml = specs
      ? `
        ${specRow('Equipment Type', specs.equipmentType)}
        ${specRow('Sensor Type', specs.sensorType)}
        ${specRow('Voice/No Voice', specs.voiceNoVoice)}
        ${specRow('Power Source', specs.powerSource)}
        ${specRow('Interconnectedness', specs.interconnectedness)}
        ${specRow('Product Page', specs.url ? `<a href="${specs.url}" target="_blank" rel="noopener">View</a>` : null)}
      `
      : `<div class="unavailable">Spec data not available for this model.</div>`;

    card.innerHTML = `
      <div class="match-top">
        <img src="${m.imageUrl}" alt="${m.model}">
        <div class="match-info">
          <div class="model">${m.model}</div>
          <div class="brand">${m.brand}</div>
          <div class="score">Similarity: ${m.similarityScore}</div>
        </div>
      </div>
      <div class="specs">${specsHtml}</div>
      <button type="button" class="add-btn">ADD TO LIST</button>
    `;

    const addBtn = card.querySelector('.add-btn');
    addBtn.addEventListener('click', () => addToRunningList(card, addBtn, m, specs));

    matchListEl.appendChild(card);
  });

  matchesEl.style.display = 'block';
}

function addToRunningList(cardEl, btnEl, match, specs) {
  if (addedForCurrentSearch) return;

  const room = roomInput.value.trim() || '(room not specified)';

  const entry = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
    room,
    brand: match.brand,
    model: match.model,
    equipmentType: specs ? specs.equipmentType : null,
    sensorType: specs ? specs.sensorType : null,
    voiceNoVoice: specs ? specs.voiceNoVoice : null,
    powerSource: specs ? specs.powerSource : null,
    interconnectedness: specs ? specs.interconnectedness : null,
    url: specs ? specs.url : null
  };

  recordedEquipment.push(entry);
  renderRunningList();

  addedForCurrentSearch = true;

  document.querySelectorAll('.match-card .add-btn').forEach(b => {
    b.disabled = true;
  });
  btnEl.textContent = 'ADDED';
  btnEl.classList.add('added');
  cardEl.classList.add('selected');
}

function removeFromRunningList(id) {
  recordedEquipment = recordedEquipment.filter(e => e.id !== id);
  renderRunningList();
}

function renderRunningList() {
  if (!recordedEquipment.length) {
    runningListEl.innerHTML = '<div class="empty-list">No equipment recorded yet.</div>';
    return;
  }

  runningListEl.innerHTML = '';

  recordedEquipment.forEach(entry => {
    const item = document.createElement('div');
    item.className = 'list-item';
    item.innerHTML = `
      <div class="list-item-info">
        <div class="model">${entry.brand} ${entry.model}</div>
        <div class="room">${entry.room}</div>
      </div>
      <button type="button" class="delete-btn">DELETE</button>
    `;
    item.querySelector('.delete-btn').addEventListener('click', () => removeFromRunningList(entry.id));
    runningListEl.appendChild(item);
  });
}

renderRunningList();

// ── IFRAME AUTO-RESIZE: report height to parent page whenever content changes ──
function reportHeight() {
  const h = document.documentElement.scrollHeight;
  window.parent.postMessage({ action: 'resize', height: h }, '*');
}
new ResizeObserver(reportHeight).observe(document.body);
window.addEventListener('load', reportHeight);
</script>
</body>
</html>
