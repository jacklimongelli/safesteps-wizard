<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipment ID Test — Gemini</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#f4f1ea;padding:20px;color:#1c1208}
  .wrap{max-width:480px;margin:0 auto}
  h1{font-size:1.2rem;margin-bottom:4px}
  .sub{font-size:.8rem;color:#666;margin-bottom:20px}
  input[type=file]{display:none}
  .upload-btn{display:block;width:100%;padding:16px;background:#1c1208;color:#fff;
    text-align:center;border-radius:8px;font-size:1rem;cursor:pointer;margin-bottom:16px}
  .preview{width:100%;border-radius:8px;margin-bottom:16px;display:none}
  .status{font-size:.85rem;color:#666;margin-bottom:16px;display:none}
  .result{background:#fff;border-radius:8px;padding:14px;margin-bottom:10px;
    border:1px solid rgba(0,0,0,.08);display:none;white-space:pre-wrap;font-size:.85rem;line-height:1.5}
  .error{color:#b00020;font-size:.85rem;padding:10px;background:#fce8e8;border-radius:6px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Equipment ID Test — Gemini</h1>
  <div class="sub">Take a photo of an installed device to test Gemini identification (grounded search).</div>

  <label class="upload-btn" for="cameraInput">Take Photo</label>
  <input type="file" id="cameraInput" accept="image/*" capture="environment">

  <label class="upload-btn" for="uploadInput" style="background:#555">Upload Photo</label>
  <input type="file" id="uploadInput" accept="image/*">

  <img class="preview" id="preview">
  <div class="status" id="status">Analyzing...</div>
  <div class="error" id="error"></div>
  <div class="result" id="result"></div>
</div>

<script>
const GROUNDED_WORKER_URL = 'https://restless-king-cbcd.jack-limongelli.workers.dev';

const cameraInput = document.getElementById('cameraInput');
const uploadInput = document.getElementById('uploadInput');
const preview = document.getElementById('preview');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const resultEl = document.getElementById('result');

async function handlePhoto(file) {
  if (!file) return;

  errorEl.style.display = 'none';
  resultEl.style.display = 'none';

  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  statusEl.style.display = 'block';

  try {
    const base64 = await resizeAndEncode(file, 1200);
    statusEl.textContent = 'Payload size: ' + Math.round(base64.length / 1024) + ' KB. Running grounded search...';

    const res = await fetch(GROUNDED_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image: base64,
        mimeType: 'image/jpeg'
      })
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderResult(data);

  } catch (err) {
    errorEl.textContent = 'Error name: ' + err.name + ' | Message: ' + err.message + ' | Type: ' + typeof err;
    errorEl.style.display = 'block';
  } finally {
    statusEl.style.display = 'none';
  }
}

cameraInput.addEventListener('change', (e) => handlePhoto(e.target.files[0]));
uploadInput.addEventListener('change', (e) => handlePhoto(e.target.files[0]));

function resizeAndEncode(file, maxWidth) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();

    reader.onload = () => { img.src = reader.result; };
    reader.onerror = reject;

    img.onload = () => {
      let { width, height } = img;
      if (width > maxWidth) {
        height = Math.round(height * (maxWidth / width));
        width = maxWidth;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);

      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      resolve(dataUrl.split(',')[1]);
    };
    img.onerror = reject;

    reader.readAsDataURL(file);
  });
}

function renderResult(data) {
  if (data.error) {
    errorEl.textContent = 'Worker error: ' + data.error;
    errorEl.style.display = 'block';
    return;
  }

  const matches = data.matches;
  if (!matches || !matches.length) {
    errorEl.textContent = 'No matches returned. Raw response: ' + JSON.stringify(data).slice(0, 500);
    errorEl.style.display = 'block';
    return;
  }

  const lines = matches.map((m, i) =>
    `${i + 1}. Brand: ${m.brand} | Model: ${m.model} | Similarity: ${m.similarityScore}`
  );

  resultEl.textContent = lines.join('\n');
  resultEl.style.display = 'block';
}

</script>
</body>
</html>
